services:
  web:
    # Construir usando el Dockerfile del directorio actual (.)
    build: .
    container_name: flask_login_backend

    # Mapeo de puertos: Puerto PC : Puerto Contenedor
    ports:
      - "5000:5000"

    # Volúmenes: Sincroniza tu carpeta actual con /app en el contenedor.
    # Esto permite que si cambias el código en tu PC, se actualice en Docker
    # sin tener que reconstruir la imagen (gracias al debug=True de Flask).
    volumes:
      - .:/app

    environment:
      - SECRET_KEY=${SECRET_KEY}

# MTU reducido: conexiones PPPoE (común en México, ej. Telmex) usan MTU 1492,
# pero la red interna de Docker usa 1500 por default. Eso corta paquetes grandes
# a medio TLS y se ve como timeouts random de pip. 1400 da margen de sobra.
networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1400
